# ----- Docker 环境配置 -----
# 激活方式：SPRING_PROFILES_ACTIVE=docker
# 所有敏感配置通过环境变量注入

spring.application.name=evalforge-backend
server.port=8081
server.address=0.0.0.0

# ---- 数据库 ----
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:evalforge}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&sessionVariables=time_zone='%2B08:00'
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true

# ---- 文件上传 ----
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ---- MinIO（可选，文件存储）----
minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
minio.access-key=${MINIO_ACCESS_KEY:demo-access-key}
minio.secret-key=${MINIO_SECRET_KEY:demo-secret-key}
minio.bucket=${MINIO_BUCKET:evalforge-uploads}

# ---- 公开访问地址（图片/文件URL拼接用）----
evalforge.public-base-url=${PUBLIC_BASE_URL:http://127.0.0.1:8081}

# ---- 平台识别（根据环境 URL 中是否包含以下 host:port 判断所属平台 SemiClaw / SemiMind）----
evalforge.platform-detection.semiclaw-hosts=${EVALFORGE_SEMICLAW_HOSTS:demo-claw-sit.example.invalid:7630,demo-claw-prod.example.invalid:8630}
evalforge.platform-detection.semind-hosts=${EVALFORGE_SEMIND_HOSTS:demo-dev.example.invalid:6111,demo-sit.example.invalid:7111,demo-prod.example.invalid:8111}

# ---- SemiClaw SSL ----
semiclaw.ssl.trust-all=${SEMICLAW_SSL_TRUST_ALL:false}

# ---- SemiClaw WS 鉴权模式：ticket(新协议) / token(旧协议) ----
semiclaw.ws.auth-mode=${SEMICLAW_WS_AUTH_MODE:ticket}

# ---- SemiClaw 服务账号 ----
# 通过环境变量注入 JSON 数组：
# SEMICLAW_SERVICE_ACCOUNTS_JSON=[{"key":"prod","name":"semiclaw-prod","baseUrl":"https://...","tenantId":"...","username":"...","password":"...","enabled":true}]
semiclaw.service-accounts.keys=sit,prod

# 也可以逐条配置：SEMICLAW_ACCOUNT_<KEY>_BASE_URL 等
semiclaw.service-accounts.sit.name=${SEMICLAW_SIT_NAME:semiclaw-sit}
semiclaw.service-accounts.sit.base-url=${SEMICLAW_SIT_BASE_URL:}
semiclaw.service-accounts.sit.tenant-id=${SEMICLAW_SIT_TENANT_ID:}
semiclaw.service-accounts.sit.username=${SEMICLAW_SIT_USERNAME:}
semiclaw.service-accounts.sit.password=${SEMICLAW_SIT_PASSWORD:}
semiclaw.service-accounts.sit.enabled=${SEMICLAW_SIT_ENABLED:false}

semiclaw.service-accounts.prod.name=${SEMICLAW_PROD_NAME:semiclaw-prod}
semiclaw.service-accounts.prod.base-url=${SEMICLAW_PROD_BASE_URL:}
semiclaw.service-accounts.prod.tenant-id=${SEMICLAW_PROD_TENANT_ID:}
semiclaw.service-accounts.prod.username=${SEMICLAW_PROD_USERNAME:}
semiclaw.service-accounts.prod.password=${SEMICLAW_PROD_PASSWORD:}
semiclaw.service-accounts.prod.enabled=${SEMICLAW_PROD_ENABLED:false}

# ---- 远程环境数据库配置（Dev/Sit/Prod 三套 SemiMind 环境）----
env.db.dev.url=${ENV_DB_DEV_URL:jdbc:mysql://127.0.0.1:3306/evalforge_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&sessionVariables=time_zone='%2B08:00'}
env.db.dev.username=${ENV_DB_DEV_USERNAME:root}
env.db.dev.password=${ENV_DB_DEV_PASSWORD:}
env.db.dev.frontend-url=${ENV_DB_DEV_FRONTEND_URL:}
env.db.dev.authorization=${ENV_DB_DEV_AUTHORIZATION:}
env.db.dev.api-username=${ENV_DB_DEV_API_USERNAME:}

env.db.sit.url=${ENV_DB_SIT_URL:jdbc:mysql://127.0.0.1:3306/evalforge_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&sessionVariables=time_zone='%2B08:00'}
env.db.sit.username=${ENV_DB_SIT_USERNAME:}
env.db.sit.password=${ENV_DB_SIT_PASSWORD:}
env.db.sit.frontend-url=${ENV_DB_SIT_FRONTEND_URL:}
env.db.sit.authorization=${ENV_DB_SIT_AUTHORIZATION:}
env.db.sit.api-username=${ENV_DB_SIT_API_USERNAME:}

env.db.prod.url=${ENV_DB_PROD_URL:jdbc:mysql://127.0.0.1:3306/evalforge_demo?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&sessionVariables=time_zone='%2B08:00'}
env.db.prod.username=${ENV_DB_PROD_USERNAME:}
env.db.prod.password=${ENV_DB_PROD_PASSWORD:}
env.db.prod.frontend-url=${ENV_DB_PROD_FRONTEND_URL:}
env.db.prod.authorization=${ENV_DB_PROD_AUTHORIZATION:}
env.db.prod.api-username=${ENV_DB_PROD_API_USERNAME:}

# ---- 评测用账号 ----
eval.test-account.dev.nickname=${EVAL_DEV_NICKNAME:agent test}
eval.test-account.dev.password=${EVAL_DEV_PASSWORD:}
eval.test-account.sit.nickname=${EVAL_SIT_NICKNAME:agent test}
eval.test-account.sit.password=${EVAL_SIT_PASSWORD:}
eval.test-account.prod.nickname=${EVAL_PROD_NICKNAME:agent test}
eval.test-account.prod.password=${EVAL_PROD_PASSWORD:}

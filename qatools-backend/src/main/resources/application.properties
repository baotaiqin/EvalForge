spring.application.name=qatools-backend
server.port=8081
server.address=0.0.0.0

# Local development defaults. Supply private credentials via environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/qa_tools?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:qatools}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:init.sql
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
minio.access-key=${MINIO_ACCESS_KEY:demo-access-key}
minio.secret-key=${MINIO_SECRET_KEY:demo-secret-key}
minio.bucket=${MINIO_BUCKET:qatools-uploads}
qatools.public-base-url=${PUBLIC_BASE_URL:http://127.0.0.1:8081}

# Configure these environment databases only when a real integration is required.
env.db.dev.url=${ENV_DB_DEV_URL:jdbc:mysql://127.0.0.1:3306/qatools_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
env.db.dev.username=${ENV_DB_DEV_USERNAME:}
env.db.dev.password=${ENV_DB_DEV_PASSWORD:}
env.db.dev.frontend-url=${ENV_DB_DEV_FRONTEND_URL:demo-dev.example.invalid:6111}
env.db.dev.authorization=${ENV_DB_DEV_AUTHORIZATION:}
env.db.dev.api-username=${ENV_DB_DEV_API_USERNAME:}

env.db.sit.url=${ENV_DB_SIT_URL:jdbc:mysql://127.0.0.1:3306/qatools_sit?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
env.db.sit.username=${ENV_DB_SIT_USERNAME:}
env.db.sit.password=${ENV_DB_SIT_PASSWORD:}
env.db.sit.frontend-url=${ENV_DB_SIT_FRONTEND_URL:demo-sit.example.invalid:7111}
env.db.sit.authorization=${ENV_DB_SIT_AUTHORIZATION:}
env.db.sit.api-username=${ENV_DB_SIT_API_USERNAME:}

env.db.prod.url=${ENV_DB_PROD_URL:jdbc:mysql://127.0.0.1:3306/qatools_prod?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
env.db.prod.username=${ENV_DB_PROD_USERNAME:}
env.db.prod.password=${ENV_DB_PROD_PASSWORD:}
env.db.prod.frontend-url=${ENV_DB_PROD_FRONTEND_URL:demo-prod.example.invalid:8111}
env.db.prod.authorization=${ENV_DB_PROD_AUTHORIZATION:}
env.db.prod.api-username=${ENV_DB_PROD_API_USERNAME:}

eval.test-account.dev.nickname=${EVAL_DEV_NICKNAME:demo-eval-account}
eval.test-account.dev.password=${EVAL_DEV_PASSWORD:}
eval.test-account.sit.nickname=${EVAL_SIT_NICKNAME:demo-eval-account}
eval.test-account.sit.password=${EVAL_SIT_PASSWORD:}
eval.test-account.prod.nickname=${EVAL_PROD_NICKNAME:demo-eval-account}
eval.test-account.prod.password=${EVAL_PROD_PASSWORD:}

semiclaw.ssl.trust-all=${SEMICLAW_SSL_TRUST_ALL:false}
semiclaw.service-accounts.keys=sit,prod
semiclaw.service-accounts.sit.name=${SEMICLAW_SIT_NAME:semiclaw-sit}
semiclaw.service-accounts.sit.base-url=${SEMICLAW_SIT_BASE_URL:}
semiclaw.service-accounts.sit.tenant-id=${SEMICLAW_SIT_TENANT_ID:}
semiclaw.service-accounts.sit.username=${SEMICLAW_SIT_USERNAME:}
semiclaw.service-accounts.sit.password=${SEMICLAW_SIT_PASSWORD:}
semiclaw.service-accounts.sit.enabled=${SEMICLAW_SIT_ENABLED:false}
semiclaw.service-accounts.prod.name=${SEMICLAW_PROD_NAME:semiclaw-prod}
semiclaw.service-accounts.prod.base-url=${SEMICLAW_PROD_BASE_URL:}
semiclaw.service-accounts.prod.tenant-id=${SEMICLAW_PROD_TENANT_ID:}
semiclaw.service-accounts.prod.username=${SEMICLAW_PROD_USERNAME:}
semiclaw.service-accounts.prod.password=${SEMICLAW_PROD_PASSWORD:}
semiclaw.service-accounts.prod.enabled=${SEMICLAW_PROD_ENABLED:false}

qatools.platform-detection.semiclaw-hosts=${QATOOLS_SEMICLAW_HOSTS:demo-claw-sit.example.invalid:7630,demo-claw-prod.example.invalid:8630}
qatools.platform-detection.semimind-hosts=${QATOOLS_SEMIMIND_HOSTS:demo-dev.example.invalid:6111,demo-sit.example.invalid:7111,demo-prod.example.invalid:8111}
